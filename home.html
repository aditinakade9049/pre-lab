<!DOCTYPE html>
<html>
<head>
    <title>Home</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: #ecf0f1;
        }

        .header {
            background-color: #3498db;
            color: white;
            padding: 25px;
            text-align: center;
        }

        .container {
            padding: 30px;
            text-align: center;
        }

        .cards {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .card {
            background: white;
            width: 220px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }

        .card:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>Welcome to My Website</h1>
        <p>Frames & Embedding Project</p>
    </div>

    <div class="container">
        <h2>Explore Features</h2>

        <div class="cards">
            <div class="card">
                <h3>🗺️ Maps</h3>
                <p>View locations using embedded maps.</p>
            </div>

            <div class="card">
                <h3>🌐 External Pages</h3>
                <p>Open websites inside the frame.</p>
            </div>
        </div>
    </div>

</body>
</html>
