<html>
<head>
<title>green Boxes</title>
<style>
body {
    margin:0;
    font-family:Arial,sans-serif;
    background: lightyellow;
    text-align:center;
}
header {
    background: green;
    color:white;
    padding:15px;
}
.container {
    display:flex;
    justify-content:center;
    gap:20px;
    padding:20px;
}
.box {
    border:2px solid green;
    border-radius:10px;
    width:350px;
    height:250px;
    box-shadow:2px 2px gray;
    overflow:hidden;
    transition: transform 0.3s, box-shadow 0.3s;
}
.box:hover {
    transform: scale(1.05);
    box-shadow:4px 4px 12px darkgray;
}
iframe {width:100%; height:100%; border:none;}
h2 {text-shadow:1px 1px gray;}
</style>
</head>
<body>

<header>
<h1>Pages / Maps</h1>
</header>

<h2>Click inside the boxes to interact</h2>
<div class="container">

<div class="box">
<iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3023.921951093587!2d-74.00601548459485!3d40.71277597933188!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x89c25a316ba8f041%3A0x9c5ed0e0f5e2c5d7!2sNew%20York%2C%20NY%2C%20USA!5e0!3m2!1sen!2sin!4v1691999999999!5m2!1sen!2sin"></iframe>
</div>

<div class="box">
<iframe src="https://www.example.com"></iframe>
</div>

<div class="box">
<iframe src="https://www.wikipedia.org"></iframe>
</div>

</div>

</body>
</html>
