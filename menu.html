<!DOCTYPE html>
<html>
<head>
    <title>Menu</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #2c3e50;
            color: white;
        }

        .header {
            text-align: center;
            padding: 20px;
            background-color: #1a252f;
        }

        .menu {
            padding: 20px;
        }

        .menu a {
            display: block;
            text-decoration: none;
            color: white;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            background-color: #34495e;
            transition: 0.3s;
        }

        .menu a:hover {
            background-color: #3498db;
        }
    </style>
</head>

<body>

    <div class="header">
        <h2>📋 Menu</h2>
    </div>

    <div class="menu">
        <a href="home.html" target="contentFrame">🏠 Home</a>
        <a href="map.html" target="contentFrame">🗺️ View Map</a>
        <a href="external.html" target="contentFrame">🌐 External Page</a>
    </div>

</body>
</html>
